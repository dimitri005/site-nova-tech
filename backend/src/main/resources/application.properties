spring.application.name=novatech-solution-api
spring.profiles.default=${SPRING_PROFILES_DEFAULT:dev}
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/NOVA}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:12MB}
novatech.media.storage-path=${MEDIA_STORAGE_PATH:./var/media}
novatech.media.max-bytes=${MEDIA_MAX_FILE_BYTES:10485760}

novatech.security.jwt.issuer=${JWT_ISSUER:novatech-solution}
novatech.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT30M}
novatech.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:PT8H}
novatech.security.rate-limit.public-posts-per-minute=${PUBLIC_POSTS_PER_MINUTE:10}
novatech.security.rate-limit.window=${PUBLIC_POST_WINDOW:PT1M}
novatech.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
novatech.site.public-url=${PUBLIC_SITE_URL:http://localhost:5173}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=NovaTech Solution API
info.app.description=Backend du site vitrine bilingue NovaTech Solution
info.app.version=1.0.0
management.info.env.enabled=true
